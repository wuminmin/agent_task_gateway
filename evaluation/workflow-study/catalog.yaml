catalog_version: "2026-07-28.workflow-study.1"

sources:
  - name: workflow_study
    datasource_id: taskgate-demo-travel
    type: postgres
    address: business-postgres
    port: 5432
    database: travel_demo
    user: gateway_reader
    postgres_major_version: 16
    schema_digest: feea9c31819bbe9313e42d7ebab0f6ef9bc7900e390495948f404b7ea68c2992
    secretRef: GATEWAY_DB_PASSWORD

scopes:
  - name: business_unit
    type: enum
    description: Independent organizational scope for the workflow study
    allowed_values: [sales, engineering, finance]
  - name: event_date
    type: date_range
    description: Study event-date interval
    min: "2026-01-01"
    max: "2026-06-30"

products:
  - name: wf_expense_claim
    source: workflow_study
    reporting_view: reporting.wf_expense_claim
    description: Synthetic but case-grounded employee reimbursement claims
    sensitivity: high
    snapshot: workflow-study-2026-v1
    entity_key: [claim_id]
    fact_namespace: workflow.finance.expense_claim
    stable_relation_role: expense_claim
    scopes: [business_unit, event_date]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - {name: claim_id, type: bigint, description: Stable synthetic claim identifier}
      - {name: employee_code, type: text, collation: en_US.utf8, collation_version: "2.36", description: Pseudonymous employee identifier, sensitivity: high}
      - {name: employee_name, type: text, collation: en_US.utf8, collation_version: "2.36", description: Synthetic employee name, sensitivity: high}
      - {name: business_unit, type: text, collation: en_US.utf8, collation_version: "2.36", description: Organizational scope}
      - {name: event_date, type: date, description: Expense date}
      - {name: submitted_date, type: date, description: Claim submission date}
      - {name: category, type: text, collation: en_US.utf8, collation_version: "2.36", description: Expense category}
      - {name: amount, type: numeric, description: Claimed amount, sensitivity: medium}
      - {name: city, type: text, collation: en_US.utf8, collation_version: "2.36", description: Expense city}
      - {name: merchant, type: text, collation: en_US.utf8, collation_version: "2.36", description: Merchant label, sensitivity: medium}
      - {name: purpose, type: text, collation: en_US.utf8, collation_version: "2.36", description: Business purpose, sensitivity: medium}
      - {name: status, type: text, collation: en_US.utf8, collation_version: "2.36", description: Approval status}

  - name: wf_expense_policy
    source: workflow_study
    reporting_view: reporting.wf_expense_policy
    description: City and expense-category reimbursement ceilings
    sensitivity: low
    snapshot: workflow-study-2026-v1
    entity_key: [policy_id]
    fact_namespace: workflow.finance.expense_policy
    stable_relation_role: expense_policy
    scopes: [business_unit]
    allowed_functions: []
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - {name: policy_id, type: bigint, description: Policy-row identifier}
      - {name: business_unit, type: text, collation: en_US.utf8, collation_version: "2.36", description: Organizational scope}
      - {name: city, type: text, collation: en_US.utf8, collation_version: "2.36", description: Policy city}
      - {name: category, type: text, collation: en_US.utf8, collation_version: "2.36", description: Expense category}
      - {name: max_amount, type: numeric, description: Maximum reimbursable amount}

  - name: wf_support_ticket
    source: workflow_study
    reporting_view: reporting.wf_support_ticket
    description: Synthetic support workflow with SLA and escalation outcomes
    sensitivity: high
    snapshot: workflow-study-2026-v1
    entity_key: [ticket_id]
    fact_namespace: workflow.support.ticket
    stable_relation_role: support_ticket
    scopes: [business_unit, event_date]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - {name: ticket_id, type: bigint, description: Stable ticket identifier}
      - {name: customer_code, type: text, collation: en_US.utf8, collation_version: "2.36", description: Pseudonymous customer identifier, sensitivity: high}
      - {name: customer_name, type: text, collation: en_US.utf8, collation_version: "2.36", description: Synthetic customer name, sensitivity: high}
      - {name: business_unit, type: text, collation: en_US.utf8, collation_version: "2.36", description: Organizational scope}
      - {name: event_date, type: date, description: Ticket opened date}
      - {name: priority, type: text, collation: en_US.utf8, collation_version: "2.36", description: Ticket priority}
      - {name: issue_type, type: text, collation: en_US.utf8, collation_version: "2.36", description: Issue category}
      - {name: service_tier, type: text, collation: en_US.utf8, collation_version: "2.36", description: Service tier used for the ticket}
      - {name: first_response_minutes, type: integer, description: First-response latency}
      - {name: sla_minutes, type: integer, description: Contractual first-response ceiling}
      - {name: channel, type: text, collation: en_US.utf8, collation_version: "2.36", description: Contact channel}
      - {name: escalated, type: boolean, description: Whether the ticket escalated}
      - {name: reopened, type: boolean, description: Whether the ticket reopened}
      - {name: status, type: text, collation: en_US.utf8, collation_version: "2.36", description: Ticket state}

  - name: wf_customer_entitlement
    source: workflow_study
    reporting_view: reporting.wf_customer_entitlement
    description: Customer support-entitlement intervals
    sensitivity: high
    snapshot: workflow-study-2026-v1
    entity_key: [customer_id]
    fact_namespace: workflow.support.entitlement
    stable_relation_role: customer_entitlement
    scopes: [business_unit]
    allowed_functions: []
    allowed_operators: ["=", "<>", "<", "<=", ">", ">="]
    allowed_aggregates: [count, min, max]
    fields:
      - {name: customer_id, type: bigint, description: Stable entitlement identifier}
      - {name: customer_code, type: text, collation: en_US.utf8, collation_version: "2.36", description: Pseudonymous customer identifier, sensitivity: high}
      - {name: customer_name, type: text, collation: en_US.utf8, collation_version: "2.36", description: Synthetic customer name, sensitivity: high}
      - {name: business_unit, type: text, collation: en_US.utf8, collation_version: "2.36", description: Organizational scope}
      - {name: entitlement_tier, type: text, collation: en_US.utf8, collation_version: "2.36", description: Contractual support tier}
      - {name: active_from, type: date, description: Entitlement start}
      - {name: active_to, type: date, description: Entitlement end}

  - name: wf_payment
    source: workflow_study
    reporting_view: reporting.wf_payment
    description: Synthetic procurement payments containing controlled audit cases
    sensitivity: high
    snapshot: workflow-study-2026-v1
    entity_key: [payment_id]
    fact_namespace: workflow.procurement.payment
    stable_relation_role: payment
    scopes: [business_unit, event_date]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - {name: payment_id, type: bigint, description: Stable payment identifier}
      - {name: vendor_code, type: text, collation: en_US.utf8, collation_version: "2.36", description: Pseudonymous vendor identifier, sensitivity: high}
      - {name: vendor_name, type: text, collation: en_US.utf8, collation_version: "2.36", description: Synthetic vendor name, sensitivity: high}
      - {name: business_unit, type: text, collation: en_US.utf8, collation_version: "2.36", description: Organizational scope}
      - {name: event_date, type: date, description: Payment date}
      - {name: amount, type: numeric, description: Payment amount, sensitivity: medium}
      - {name: invoice_no, type: text, collation: en_US.utf8, collation_version: "2.36", description: Invoice reference, sensitivity: high}
      - {name: purpose, type: text, collation: en_US.utf8, collation_version: "2.36", description: Procurement purpose}
      - {name: approval_tier, type: text, collation: en_US.utf8, collation_version: "2.36", description: Highest approval tier}
      - {name: status, type: text, collation: en_US.utf8, collation_version: "2.36", description: Payment status}

  - name: wf_vendor
    source: workflow_study
    reporting_view: reporting.wf_vendor
    description: Vendor risk and lifecycle attributes
    sensitivity: medium
    snapshot: workflow-study-2026-v1
    entity_key: [vendor_id, business_unit]
    fact_namespace: workflow.procurement.vendor
    stable_relation_role: vendor
    scopes: [business_unit]
    allowed_functions: []
    allowed_operators: ["=", "<>", "<", "<=", ">", ">="]
    allowed_aggregates: [count, min, max]
    fields:
      - {name: vendor_id, type: bigint, description: Stable vendor identifier}
      - {name: business_unit, type: text, collation: en_US.utf8, collation_version: "2.36", description: Organizational scope}
      - {name: vendor_code, type: text, collation: en_US.utf8, collation_version: "2.36", description: Pseudonymous vendor identifier, sensitivity: high}
      - {name: vendor_name, type: text, collation: en_US.utf8, collation_version: "2.36", description: Synthetic vendor name, sensitivity: high}
      - {name: risk_tier, type: text, collation: en_US.utf8, collation_version: "2.36", description: Vendor risk tier, sensitivity: medium}
      - {name: country, type: text, collation: en_US.utf8, collation_version: "2.36", description: Vendor country}
      - {name: active, type: boolean, description: Vendor active flag}

approval_routes:
  - {sensitivity: low, mode: manual, approver: bob, budget_profile: workflow-study-v3}
  - {sensitivity: medium, mode: manual, approver: bob, budget_profile: workflow-study-v3}
  - {sensitivity: high, mode: manual, approver: bob, budget_profile: workflow-study-v3}

budget_profiles:
  - name: workflow-study-v3
    max_queries: 20
    max_rows: 2000
    max_db_time: 2m
    query_timeout: 15s
    task_ttl: 2h
    max_release_facts: 20000
    max_influence_facts: 100000
    max_outcome_facts: 20
    exposure_profile_version: taskgate-exposure-v3
