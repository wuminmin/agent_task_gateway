catalog_version: "2026-07-30.v4-small-regression.1"

sources:
  - name: travel_demo
    datasource_id: taskgate-demo-travel
    type: postgres
    address: business-postgres
    port: 5432
    database: travel_demo
    user: gateway_reader
    postgres_major_version: 16
    schema_digest: 02b4a211cfbab7347fdce28e2dd76406b1118c5f18e1d2146cc2e85a38ccf1cc
    secretRef: GATEWAY_DB_PASSWORD

snapshot_publications:
  - name: expense-summary-v1
    source: travel_demo
    source_namespace: travel.expense_summary
    snapshot: travel-demo-2026-v1
    ordinal_sidecar: taskgate_ordinal.expense_summary_v1
    sidecar_digest: 2cd4e5c835252ec3bcd04aee11c28c70c6329b35bf6770f06a570cd918c9ceff
    dictionary_digest: ac0239021ec58514d62ac0c4c56191c2337fc943106b6df900221e620e809a1f
    manifest_digest: 8d675bbf97adfbc03234a468055c223a9ea3d9ffc6ab2d5f6b8da38abeb70432
  - name: expense-detail-v1
    source: travel_demo
    source_namespace: travel.expense_receipt
    snapshot: travel-demo-2026-v1
    ordinal_sidecar: taskgate_ordinal.expense_detail_v1
    sidecar_digest: bbf33dd42179b80cd8cca631f579c4c6e49ef51eb1d3a4ce157090a797c5acf7
    dictionary_digest: 315995feeaa332b0d0f50834867ed5701a491ddc547bb2d666338fc938057232
    manifest_digest: 9bc393632756c13ed355181658a6358aa656e1a828f69da36fc951c5061d390c

scopes:
  - name: department
    type: enum
    description: 任务获批后允许访问的部门范围
    allowed_values: [销售部, 研发部, 财务部]

products:
  - name: expense_summary
    source: travel_demo
    reporting_view: reporting.expense_summary
    description: 按月份、部门和费用类型汇总的差旅报销数据
    sensitivity: low
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-summary-v1
    entity_key: [month, department, expense_type]
    fact_namespace: travel.expense_summary
    stable_relation_role: expense_summary
    scopes: [department]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: month
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 月份，格式 YYYY-MM
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: total_amount
        type: numeric
        description: 总金额
      - name: request_count
        type: bigint
        description: 申请数

  - name: expense_detail
    source: travel_demo
    reporting_view: reporting.expense_detail
    description: 员工级差旅报销明细
    sensitivity: high
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-detail-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: employee_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 员工编号
        sensitivity: high
      - name: employee_name
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 员工姓名
        sensitivity: high
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_date
        type: date
        description: 报销日期
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: amount
        type: numeric
        description: 报销金额
      - name: city
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 出差城市
      - name: purpose
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销用途
      - name: status
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 审批状态

approval_routes:
  - sensitivity: low
    mode: manual
    approver: bob
    budget_profile: v4-small-regression
  - sensitivity: medium
    mode: manual
    approver: bob
    budget_profile: v4-small-regression
  - sensitivity: high
    mode: manual
    approver: bob
    budget_profile: v4-small-regression

budget_profiles:
  - name: v4-small-regression
    max_queries: 5000
    max_rows: 10000
    max_db_time: 1h
    query_timeout: 15s
    task_ttl: 4h
    max_release_facts: 100000
    max_influence_facts: 500000
    max_outcome_facts: 10000
    exposure_profile_version: taskgate-exposure-v4
