scopes:
  - name: dataset_partition
    type: enum
    description: Fixed deterministic evaluation partition
    allowed_values: ["1"]

products:
  - name: scale_orders
    source: scale_demo
    reporting_view: reporting.scale_orders
    description: Frozen deterministic order relation for the V4 maximum point
    sensitivity: low
    snapshot: exposure-scale-2026-v4-narrow-1
    snapshot_publication: scale-orders-v4-narrow-1
    entity_key: [o_orderkey]
    fact_namespace: evaluation.scale_orders
    stable_relation_role: scale_orders
    scopes: [dataset_partition]
    allowed_functions: []
    allowed_operators: ["=", "<", "<=", ">", ">="]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: dataset_partition
        type: smallint
        description: Fixed evaluation partition
      - name: o_orderkey
        type: bigint
        description: Stable synthetic order key
      - name: o_orderstatus
        type: smallint
        description: Three-valued synthetic order status

  - name: scale_lineitem
    source: scale_demo
    reporting_view: reporting.scale_lineitem
    description: Frozen five-lineitems-per-order relation for the V4 maximum point
    sensitivity: low
    snapshot: exposure-scale-2026-v4-narrow-1
    snapshot_publication: scale-lineitem-v4-narrow-1
    entity_key: [l_orderkey, l_linenumber]
    fact_namespace: evaluation.scale_lineitem
    stable_relation_role: scale_lineitem
    scopes: [dataset_partition]
    allowed_functions: []
    allowed_operators: ["=", "<", "<=", ">", ">="]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: dataset_partition
        type: smallint
        description: Fixed evaluation partition
      - name: l_orderkey
        type: bigint
        description: Stable synthetic parent order key
      - name: l_linenumber
        type: integer
        description: Stable line number within an order
      - name: l_extendedprice
        type: numeric
        description: Deterministic synthetic extended price

approval_routes:
  - sensitivity: low
    mode: manual
    approver: bob
    budget_profile: v4-narrow-catalog-boundary

budget_profiles:
  - name: v4-narrow-catalog-boundary
    max_queries: 10
    max_rows: 100
    max_db_time: 1h
    query_timeout: 15m
    task_ttl: 4h
    max_release_facts: 100
    max_influence_facts: 1200000
    max_outcome_facts: 10
    exposure_profile_version: taskgate-exposure-v4
