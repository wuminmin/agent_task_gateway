    secretRef: GATEWAY_DB_PASSWORD

snapshot_publications:
  - name: scale-orders-v4-narrow-1
    source: scale_demo
    source_namespace: evaluation.scale_orders
    snapshot: exposure-scale-2026-v4-narrow-1
    ordinal_sidecar: taskgate_ordinal.scale_orders_v4_narrow_1
    sidecar_digest: ae480874e97a165c67a6c174af7e427f7386d1d5e9fc44ec211af77fecfe54d4
    dictionary_digest: 89729d5455e158e1547ddaa9f2a98a50d99dabd5b0da5852209e256d3ecd22e7
    manifest_digest: be32bcfe3d0545dfe69e434c131ce6abf642cf14d4f898204a7dee120e2c6967
  - name: scale-lineitem-v4-narrow-1
    source: scale_demo
    source_namespace: evaluation.scale_lineitem
    snapshot: exposure-scale-2026-v4-narrow-1
    ordinal_sidecar: taskgate_ordinal.scale_lineitem_v4_narrow_1
    sidecar_digest: 911572c80b75642c5faa6d610092c7e369319725a4cd975784f328fd45dc0768
