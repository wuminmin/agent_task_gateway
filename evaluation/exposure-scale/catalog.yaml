catalog_version: "2026-07-27.exposure-scale.1"

sources:
  - name: scale_demo
    datasource_id: taskgate-eval-exposure-scale
    type: postgres
    address: business-postgres
    port: 5432
    database: travel_demo
    user: gateway_reader
    postgres_major_version: 16
    schema_digest: e93fa7bf76effb3d268cab94dd94e25d135ec8becc73989aeef0f1b9c927665d
    secretRef: GATEWAY_DB_PASSWORD

scopes:
  - name: dataset_partition
    type: enum
    description: Fixed deterministic evaluation partition
    allowed_values: ["1"]

products:
  - name: scale_orders
    source: scale_demo
    reporting_view: reporting.scale_orders
    description: Deterministic TPC-H-derived order relation for scale evaluation
    sensitivity: low
    snapshot: exposure-scale-2026-v1
    entity_key: [o_orderkey]
    fact_namespace: evaluation.scale_orders
    stable_relation_role: scale_orders
    scopes: [dataset_partition]
    allowed_functions: []
    allowed_operators: ["=", "<", "<=", ">", ">="]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: dataset_partition
        type: smallint
        description: Fixed evaluation partition
      - name: o_orderkey
        type: bigint
        description: Stable synthetic order key
      - name: o_orderstatus
        type: smallint
        description: Three-valued synthetic order status

  - name: scale_lineitem
    source: scale_demo
    reporting_view: reporting.scale_lineitem
    description: Five deterministic line items per synthetic order
    sensitivity: low
    snapshot: exposure-scale-2026-v1
    entity_key: [l_orderkey, l_linenumber]
    fact_namespace: evaluation.scale_lineitem
    stable_relation_role: scale_lineitem
    scopes: [dataset_partition]
    allowed_functions: []
    allowed_operators: ["=", "<", "<=", ">", ">="]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: dataset_partition
        type: smallint
        description: Fixed evaluation partition
      - name: l_orderkey
        type: bigint
        description: Stable synthetic parent order key
      - name: l_linenumber
        type: integer
        description: Stable line number within an order
      - name: l_extendedprice
        type: numeric
        description: Deterministic synthetic extended price

approval_routes:
  - sensitivity: low
    mode: manual
    approver: bob
    budget_profile: exposure-scale-v2

budget_profiles:
  - name: exposure-scale-v2
    max_queries: 8
    max_rows: 100
    max_db_time: 1h
    query_timeout: 15m
    task_ttl: 4h
    max_release_facts: 100
    max_influence_facts: 1200000
    exposure_profile_version: taskgate-exposure-v2
