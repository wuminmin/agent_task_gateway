catalog_version: "2026-07-25.exposure-performance.1"

sources:
  - name: travel_demo
    datasource_id: taskgate-demo-travel
    type: postgres
    address: business-postgres
    port: 5432
    database: travel_demo
    user: gateway_reader
    postgres_major_version: 16
    schema_digest: 02b4a211cfbab7347fdce28e2dd76406b1118c5f18e1d2146cc2e85a38ccf1cc
    secretRef: GATEWAY_DB_PASSWORD

scopes:
  - name: department
    type: enum
    description: 任务获批后允许访问的部门范围
    allowed_values: [销售部, 研发部, 财务部]
  - name: expense_date
    type: date_range
    description: 报销发生日期范围
    min: "2026-01-01"
    max: "2026-12-31"

products:
  - name: expense_summary
    source: travel_demo
    reporting_view: reporting.expense_summary
    description: 按月份、部门和费用类型汇总的差旅报销数据
    sensitivity: low
    snapshot: travel-demo-2026-v1
    entity_key: [month, department, expense_type]
    fact_namespace: travel.expense_summary
    stable_relation_role: expense_summary
    scopes: [department]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: month
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 月份，格式 YYYY-MM
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: total_amount
        type: numeric
        description: 总金额
      - name: request_count
        type: bigint
        description: 申请数

  - name: expense_detail
    source: travel_demo
    reporting_view: reporting.expense_detail
    description: 员工级差旅报销明细
    sensitivity: high
    snapshot: travel-demo-2026-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: employee_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 员工编号
        sensitivity: high
      - name: employee_name
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 员工姓名
        sensitivity: high
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_date
        type: date
        description: 报销日期
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: amount
        type: numeric
        description: 报销金额
      - name: city
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 出差城市
      - name: purpose
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销用途
      - name: status
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 审批状态

approval_routes:
  - sensitivity: low
    mode: manual
    approver: bob
    budget_profile: exposure-performance-v2
  - sensitivity: medium
    mode: manual
    approver: bob
    budget_profile: exposure-performance-v2
  - sensitivity: high
    mode: manual
    approver: bob
    budget_profile: exposure-performance-v2

budget_profiles:
  - name: exposure-performance-v2
    max_queries: 2000
    max_rows: 5000
    max_db_time: 1h
    query_timeout: 5s
    task_ttl: 2h
    max_release_facts: 100000
    max_influence_facts: 500000
    exposure_profile_version: taskgate-exposure-v2
