schema_version: 1
protocol_id: taskgate-final-v5-wsl2-v1
status: staged-source-adapters-complete-campaign-not-run
claim_boundary: WSL2 Ubuntu 22.04, one Gateway instance, PostgreSQL 16, immutable reporting publications
campaign:
  publication_deployments: 3
  fresh_wsl_restart_between_deployments: true
  replicate_contracts:
    standard:
      profiles: [baseline, scale, scale-extreme, artifact, provsql, concurrency]
      process_replicates: 1
      warmups_per_cell_per_process: 5
      measured_samples_per_cell_per_process: 30
    compiler:
      profiles: [compiler]
      process_replicates: 5
      warmups_per_cell_per_process: 1
      measured_samples_per_cell_per_process: 100
    security:
      profiles: [rls, attack]
      process_replicates: 1
      warmups_per_cell_per_process: 0
      measured_samples_per_cell_per_process: 3
    rq5:
      profiles: [rq5]
      process_replicates: 1
      warmups_per_cell_per_process: 0
      measured_samples_per_cell_per_process: 4
  randomized_arm_order: seeded
  overwrite_raw: forbidden
  adapter_protocol: adapter-operation-v1-jsonl
  adapter_stderr: forbidden
  adapter_sha256_frozen_across_deployments: true
  fresh_deployment_proof: required
  campaign_finalizer_requires_experiments: [baseline, scale, artifact, rls, attack, provsql, compiler, concurrency, rq5]
  outlier_deletion: forbidden
  publication_requires_full_commit: true
exposure:
  profile: taskgate-exposure-v5
  result_format: parquet
  receipt_version: "8"
  availability_boundary: QUERY_RESULT_CONSUMED
  headline_entrypoint: query_sql
rls_budget_rule:
  release: floor(0.70 * U_R)
  dependency: floor(0.70 * U_D)
  outcome: floor(0.70 * U_O)
  nonzero_dimension_minimum: 1
prohibitions:
  - publication campaign execution during framework development
  - historical V4 number relabeling
  - ProvSQL smoke promotion
  - paper numeric macro generation from pilot or incomplete evidence
  - product-limit increases or silent scale reduction after failure
