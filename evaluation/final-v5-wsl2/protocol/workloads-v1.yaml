schema_version: 2
# Publication profiles are deliberately machine-readable. The finalizer
# compares Config.workloads to the selected profile byte-for-byte after YAML
# decoding; a campaign cannot silently shrink, expand, or rename a cell.
profiles:
  baseline:
    workloads:
      - id: S1
        scales: [SF1, SF10]
        modes: [direct, novel, semantic_replay, idempotent_replay, normalized_rewrite_replay]
      - id: S2
        scales: [SF1, SF10]
        modes: [direct, novel, semantic_replay, idempotent_replay, normalized_rewrite_replay]
      - id: S3
        scales: [1k-5k, 10k-50k, 45k-225k]
        modes: [direct, novel, semantic_replay, idempotent_replay, normalized_rewrite_replay]
      - id: S4
        scales: [depth-4]
        modes: [direct, novel, semantic_replay]
      - id: S5
        scales: [SF1, SF10]
        modes: [direct, novel, semantic_replay, idempotent_replay]
      - id: S6
        scales: [100x4, 10k-x4, 100k-x4, 100x16, 10k-x16, 100k-x16]
        modes: [direct, novel]
  scale:
    workloads:
      - id: dependency-e2e
        scales: [10k-overlap-0, 10k-overlap-50, 10k-overlap-90, 10k-overlap-100, 100k-overlap-0, 100k-overlap-50, 100k-overlap-90, 100k-overlap-100, 1035000-overlap-0, 1035000-overlap-50, 1035000-overlap-90, 1035000-overlap-100]
        modes: [novel, semantic_replay]
      - id: outcome-merkle
        scales: [10k-x1-o0, 10k-x1-o50, 10k-x1-o90, 10k-x1-o100, 10k-x100-o0, 10k-x100-o50, 10k-x100-o90, 10k-x100-o100, 10k-x10k-o0, 10k-x10k-o50, 10k-x10k-o90, 10k-x10k-o100, 100k-x1-o0, 100k-x1-o50, 100k-x1-o90, 100k-x1-o100, 100k-x100-o0, 100k-x100-o50, 100k-x100-o90, 100k-x100-o100, 100k-x10k-o0, 100k-x10k-o50, 100k-x10k-o90, 100k-x10k-o100, 1m-x1-o0, 1m-x1-o50, 1m-x1-o90, 1m-x1-o100, 1m-x100-o0, 1m-x100-o50, 1m-x100-o90, 1m-x100-o100, 1m-x10k-o0, 1m-x10k-o50, 1m-x10k-o90, 1m-x10k-o100]
        modes: [merkle_control]
  scale-extreme:
    workloads:
      - id: taskgate_scale_extreme
        scales: [10m, 100m]
        modes: [kernel_storage_only]
  artifact:
    workloads:
      - id: result-heavy
        scales: [100x4, 10k-x4, 100k-x4, 100x16, 10k-x16, 100k-x16]
        modes: [novel]
  rls:
    workloads:
      - id: adaptive-100-v1
        scales: [100-queries]
        modes: [rls, unlimited, bounded]
      - id: policy-denied-control
        scales: [single]
        modes: [rls, unlimited, bounded]
  attack:
    workloads:
      - id: A-pagination
        scales: [complete-to-pages, pages-to-complete]
        modes: [direct, novel]
      - id: B-equivalent-sql
        scales: [variants-v1]
        modes: [direct, novel]
      - id: C-request-id
        scales: [same-and-different]
        modes: [novel, semantic_replay, idempotent_replay]
      - id: D-split-union
        scales: [complete-to-split, split-to-complete]
        modes: [direct, novel]
      - id: E-threshold
        scales: [preregistered-v1]
        modes: [direct, novel]
  provsql:
    workloads:
      - id: nonce-join-group
        scales: [1k, 10k, 45k]
        modes: [direct, provsql, taskgate]
  compiler:
    workloads:
      - id: view-depth
        scales: ["1", "2", "4", "8", "16"]
        modes: [compile]
      - id: join-sources
        scales: ["2", "4", "8", "16"]
        modes: [compile]
      - id: limit-controls
        scales: [depth-17, sources-17]
        modes: [structured_rejection]
  concurrency:
    workloads:
      - id: shared-root
        scales: ["10", "50", "100", "500"]
        modes: [forced_queue_safety, natural_contention]
      - id: serial-control
        scales: ["1"]
        modes: [serial]
  rq5:
    workloads:
      - id: daily-publication-v5
        scales: ["345000"]
        modes: [build_verify_activate, retained_route]
