services:
  business-postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    volumes:
      - ./evaluation/final-v5-wsl2/sql/observer/pg-stat-statements.sql:/docker-entrypoint-initdb.d/09-final-v5-pg-stat-statements.sql:ro
