name: taskbound-agent-data-gateway

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-demo-change-me}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-reader-demo-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      args:
        TARGET: gateway
    environment:
      GATEWAY_ADDR: :8080
      CONTROL_DB_PATH: /data/gateway.db
      CATALOG_PATH: /etc/taskbound/catalog.yaml
      GATEWAY_DATA_KEY: ${GATEWAY_DATA_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      TASKBOUND_ALICE_TOKEN: ${TASKBOUND_ALICE_TOKEN:-alice-demo-token-change-me}
      TASKBOUND_CAROL_TOKEN: ${TASKBOUND_CAROL_TOKEN:-carol-demo-token-change-me}
      OA_SERVICE_TOKEN: ${OA_SERVICE_TOKEN:-oa-service-token-change-me}
      OA_CALLBACK_SECRET: ${OA_CALLBACK_SECRET:-oa-callback-secret-change-me}
      OA_BASE_URL: http://oa-demo:8090
      PUBLIC_OA_BASE_URL: http://127.0.0.1:8090
      POSTGRES_DSN: postgres://gateway_reader:${GATEWAY_DB_PASSWORD:-gateway-reader-demo-change-me}@postgres:5432/${POSTGRES_DB:-travel_demo}?sslmode=disable
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    depends_on:
      postgres:
        condition: service_healthy
      oa-demo:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - gateway-data:/data
      - ./config/catalog.yaml:/etc/taskbound/catalog.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  oa-demo:
    build:
      context: .
      args:
        TARGET: oa-demo
    environment:
      OA_ADDR: :8090
      OA_SERVICE_TOKEN: ${OA_SERVICE_TOKEN:-oa-service-token-change-me}
      OA_CALLBACK_SECRET: ${OA_CALLBACK_SECRET:-oa-callback-secret-change-me}
      OA_SESSION_SECRET: ${OA_SESSION_SECRET:-oa-session-secret-change-me}
      OA_ALICE_PASSWORD: ${OA_ALICE_PASSWORD:-alice-demo-change-me}
      OA_BOB_PASSWORD: ${OA_BOB_PASSWORD:-bob-demo-change-me}
      GATEWAY_CALLBACK_URL: http://gateway:8080/api/v1/oa/callback
      PUBLIC_OA_BASE_URL: http://127.0.0.1:8090
    ports:
      - 127.0.0.1:8090:8090
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  gateway-data:
  pg-data:
