# Source-controlled Product declaration for the experiments that have no
# machine contract. Baseline, Scale and Artifact always derive their Product
# sets from the Contract Index instead, so this file can never disagree with a
# frozen contract.
#
# aliases maps a canonical closure digest to its readable name. The digest is
# the profile identity; the alias exists for logs and evidence only, and two
# identical closures therefore cannot become two profiles.
schema_version: 1
registry_version: taskgate-final-v5-workload-closure-profile-v2

experiments:
  # Each RLS arm requests exactly one immutable Product: the unlimited relation
  # backs both the PostgreSQL RLS control and the unlimited TaskGate arm, and
  # the 70%-budget arm has its own Product.
  rls:
    - workload_id: adaptive-100-v1
      scales: [100-queries]
      modes: [rls, unlimited]
      products: [final_v5_rls_unlimited_expense_detail]
    - workload_id: adaptive-100-v1
      scales: [100-queries]
      modes: [bounded]
      products: [final_v5_rls_bounded_expense_detail]
    - workload_id: policy-denied-control
      scales: [single]
      modes: [rls, unlimited]
      products: [final_v5_rls_unlimited_expense_detail]
    - workload_id: policy-denied-control
      scales: [single]
      modes: [bounded]
      products: [final_v5_rls_bounded_expense_detail]
  attack:
    - workload_id: A-pagination
      scales: [complete-to-pages, pages-to-complete]
      modes: [direct, novel]
      products: [final_v5_attack_expense_detail]
    - workload_id: B-equivalent-sql
      scales: [variants-v1]
      modes: [direct, novel]
      products: [final_v5_attack_expense_detail]
    - workload_id: C-request-id
      scales: [same-and-different]
      modes: [novel, semantic_replay, idempotent_replay]
      products: [final_v5_attack_expense_detail]
    - workload_id: D-split-union
      scales: [complete-to-split, split-to-complete]
      modes: [direct, novel]
      products: [final_v5_attack_expense_detail]
    - workload_id: E-threshold
      scales: [preregistered-v1]
      modes: [direct, novel]
      products: [expense_detail]
  concurrency:
    - workload_id: shared-root
      scales: ["10", "50", "100", "500"]
      modes: [forced_queue_safety, natural_contention]
      products: [final_v5_concurrency_expense_detail]
    - workload_id: serial-control
      scales: ["1"]
      modes: [serial]
      products: [final_v5_concurrency_expense_detail]
  provsql:
    - workload_id: nonce-join-group
      scales: [1k, 10k, 45k]
      modes: [direct, provsql, taskgate]
      products: [provsql_orders, provsql_lineitem, provsql_nonce]
  rq5:
    - workload_id: online-transition-v1
      scales: [single]
      modes: [build, retained]
      products: [expense_detail]

