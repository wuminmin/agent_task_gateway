# Source-controlled Product declaration for the experiments that have no
# machine contract. Baseline, Scale and Artifact always derive their Product
# sets from the Contract Index instead, so this file can never disagree with a
# frozen contract.
#
# aliases maps a canonical closure digest to its readable name. The digest is
# the profile identity; the alias exists for logs and evidence only, and two
# identical closures therefore cannot become two profiles.
schema_version: 1
registry_version: taskgate-final-v5-workload-closure-profile-v2

experiments:
  # Each RLS arm requests exactly one immutable Product: the unlimited relation
  # backs both the PostgreSQL RLS control and the unlimited TaskGate arm, and
  # the 70%-budget arm has its own Product.
  rls:
    - workload_id: adaptive-100-v1
      scales: [100-queries]
      modes: [rls, unlimited]
      products: [final_v5_rls_unlimited_expense_detail]
    - workload_id: adaptive-100-v1
      scales: [100-queries]
      modes: [bounded]
      products: [final_v5_rls_bounded_expense_detail]
    - workload_id: policy-denied-control
      scales: [single]
      modes: [rls, unlimited]
      products: [final_v5_rls_unlimited_expense_detail]
    - workload_id: policy-denied-control
      scales: [single]
      modes: [bounded]
      products: [final_v5_rls_bounded_expense_detail]
  attack:
    - workload_id: A-pagination
      scales: [complete-to-pages, pages-to-complete]
      modes: [direct, novel]
      products: [final_v5_attack_expense_detail]
    - workload_id: B-equivalent-sql
      scales: [variants-v1]
      modes: [direct, novel]
      products: [final_v5_attack_expense_detail]
    - workload_id: C-request-id
      scales: [same-and-different]
      modes: [novel, semantic_replay, idempotent_replay]
      products: [final_v5_attack_expense_detail]
    - workload_id: D-split-union
      scales: [complete-to-split, split-to-complete]
      modes: [direct, novel]
      products: [final_v5_attack_expense_detail]
    - workload_id: E-threshold
      scales: [preregistered-v1]
      modes: [direct, novel]
      products: [expense_detail]
  concurrency:
    - workload_id: shared-root
      scales: ["10", "50"]
      modes: [forced_queue_safety, natural_contention]
      products: [final_v5_concurrency_expense_detail]
    - workload_id: serial-control
      scales: ["1"]
      modes: [serial]
      products: [final_v5_concurrency_expense_detail]
  provsql:
    - workload_id: nonce-join-group
      scales: [1k, 10k, 45k]
      modes: [direct, provsql, taskgate]
      products: [provsql_orders, provsql_lineitem, provsql_nonce]
  rq5:
    - workload_id: online-transition-v1
      scales: [single]
      modes: [build, retained]
      products: [expense_detail]
  # The refused-footprint ladder is a dormant source-controlled extension
  # experiment (docs/p8): each arm requests exactly one immutable ladder
  # Product over the deterministic result relation.
  footprint:
    - workload_id: refused-footprint-ladder-v1
      scales: [1e5-rows]
      modes: [unlimited]
      products: [final_v5_footprint_unlimited_result_heavy]
    - workload_id: refused-footprint-ladder-v1
      scales: [1e5-rows]
      modes: [bounded]
      products: [final_v5_footprint_bounded_result_heavy]
  # The benign agent trace (docs/p8 c3) runs the 28 unedited lowerable
  # statements over the five shared trace Products. Budget profiles bind by
  # exact-set approval routing carried only in the profile Catalogs, so each
  # arm requests a distinct set: the x2/x4 arms add decoy products that are
  # approved but never queried.
  benign:
    - workload_id: benign-agent-trace-v1
      scales: [28-statements]
      modes: [recipe]
      products: [expense_detail, expense_summary, provsql_orders, provsql_lineitem, final_v5_result_heavy]
    - workload_id: benign-agent-trace-v1
      scales: [28-statements]
      modes: [x2]
      products: [expense_detail, expense_summary, provsql_orders, provsql_lineitem, final_v5_result_heavy,
                 provsql_nonce]
    - workload_id: benign-agent-trace-v1
      scales: [28-statements]
      modes: [x4]
      products: [expense_detail, expense_summary, provsql_orders, provsql_lineitem, final_v5_result_heavy,
                 provsql_nonce, final_v5_attack_expense_detail]
  # The P9.E scale ladder (docs/p9e) runs four SUM-ladder rungs over the
  # deterministic 750,000-row scale-e7 relation; the largest rung settles
  # more than 10^7 declared Dependency facts in one admitted query.
  scale7:
    - workload_id: scale7-ladder-v1
      scales: [sum-ladder]
      modes: [direct, novel, replay]
      products: [final_v5_scale_e7]
  # The comparator arms (docs/p8 a) execute the frozen adaptive trace on the
  # RLS unlimited product under four a-priori budgeters; the arms' product
  # sets differ by never-queried decoys so each routes to its own profile.
  counter:
    - workload_id: counter-comparator-v1
      scales: [natural, shuffled-v1, novelty-first-v1]
      modes: [exact]
      products: [final_v5_rls_unlimited_expense_detail, provsql_nonce, final_v5_attack_expense_detail]
    - workload_id: counter-comparator-v1
      scales: [natural, shuffled-v1, novelty-first-v1]
      modes: [rows]
      products: [final_v5_rls_unlimited_expense_detail, provsql_nonce]
    - workload_id: counter-comparator-v1
      scales: [natural, shuffled-v1, novelty-first-v1]
      modes: [queries]
      products: [final_v5_rls_unlimited_expense_detail, final_v5_attack_expense_detail]
    - workload_id: counter-comparator-v1
      scales: [natural, shuffled-v1, novelty-first-v1]
      modes: [release]
      products: [final_v5_rls_unlimited_expense_detail, final_v5_concurrency_expense_detail]
  # The optimizing-adversary study (docs/p9c) replays two frozen extraction
  # strategies on the RLS unlimited product under three owner-derived budget
  # tiers; tier product sets differ by never-queried decoys for routing.
  adversary:
    - workload_id: adversary-extraction-v1
      scales: [bisection, greedy]
      modes: [owner]
      products: [final_v5_rls_unlimited_expense_detail, provsql_orders]
    - workload_id: adversary-extraction-v1
      scales: [bisection, greedy]
      modes: [tightened]
      products: [final_v5_rls_unlimited_expense_detail, provsql_lineitem]
    - workload_id: adversary-extraction-v1
      scales: [bisection, greedy]
      modes: [loosened]
      products: [final_v5_rls_unlimited_expense_detail, provsql_orders, provsql_lineitem]

