approval_routes:
  - sensitivity: low
    mode: manual
    approver: bob
    budget_profile: summary-manual-v5
  - sensitivity: medium
    mode: manual
    approver: bob
    budget_profile: detail-manual-v5
  - sensitivity: high
    mode: manual
    approver: bob
    budget_profile: detail-manual-v5
  - sensitivity: medium
    products: [final_v5_attack_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-attack-medium-v1
  - sensitivity: medium
    products: [final_v5_concurrency_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-concurrency-v1
  - sensitivity: medium
    products: [final_v5_rls_unlimited_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-rls-unlimited-v1
  - sensitivity: medium
    products: [final_v5_rls_bounded_expense_detail]
    mode: manual
    approver: bob
    budget_profile: final-v5-rls-bounded-70-v1
  - sensitivity: low
    products: [provsql_lineitem, provsql_nonce, provsql_orders]
    mode: manual
    approver: bob
    budget_profile: final-v5-provsql-low-v1

budget_profiles:
  - name: summary-manual-v5
    max_queries: 10
    max_rows: 500
    max_db_time: 30s
    query_timeout: 5s
    task_ttl: 30m
    max_release_facts: 1000
    max_influence_facts: 5000
    max_outcome_facts: 10
    exposure_profile_version: taskgate-exposure-v5
    predicate_footprint:
      version: taskgate-predicate-footprint-v1
      max_raw_literals_per_query: 1000
      max_unique_atoms_per_query: 9
      max_atom_payload_bytes: 4096
      max_total_atom_payload_bytes: 36864
  - name: detail-manual-v5
    max_queries: 5
    max_rows: 100
    max_db_time: 15s
    query_timeout: 5s
    task_ttl: 15m
    max_release_facts: 500
    max_influence_facts: 2500
    max_outcome_facts: 5
    exposure_profile_version: taskgate-exposure-v5
    predicate_footprint:
      version: taskgate-predicate-footprint-v1
      max_raw_literals_per_query: 500
      max_unique_atoms_per_query: 4
      max_atom_payload_bytes: 4096
      max_total_atom_payload_bytes: 16384
  - name: final-v5-attack-medium-v1
    max_queries: 10
    max_rows: 100
    max_db_time: 15s
    query_timeout: 5s
    task_ttl: 15m
    max_release_facts: 500
