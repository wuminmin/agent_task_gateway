    predicate_footprint:
      version: taskgate-predicate-footprint-v1
      max_raw_literals_per_query: 500
      max_unique_atoms_per_query: 4
      max_atom_payload_bytes: 4096
      max_total_atom_payload_bytes: 16384
  - name: final-v5-rls-unlimited-v1
    max_queries: 110
    max_rows: 1000
    max_db_time: 10m
    query_timeout: 5s
    task_ttl: 2h
    max_release_facts: 1000
    max_influence_facts: 1000
    max_outcome_facts: 1000
    exposure_profile_version: taskgate-exposure-v5
    predicate_footprint:
      version: taskgate-predicate-footprint-v1
      max_raw_literals_per_query: 64
      max_unique_atoms_per_query: 8
      max_atom_payload_bytes: 4096
      max_total_atom_payload_bytes: 32768
