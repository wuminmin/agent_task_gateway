      max_total_atom_payload_bytes: 16384
  - name: final-v5-concurrency-v1
    max_queries: 600
    max_rows: 1000
    max_db_time: 30m
    query_timeout: 5s
    task_ttl: 2h
    max_release_facts: 5000
    max_influence_facts: 25000
    max_outcome_facts: 5
