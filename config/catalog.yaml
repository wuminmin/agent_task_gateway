scopes:
  - name: department
    type: enum
    description: 任务获批后允许访问的部门范围
    allowed_values: [销售部, 研发部, 财务部]
  - name: expense_date
    type: date_range
    description: 报销发生日期范围
    min: "2026-01-01"
    max: "2026-12-31"
  - name: partition_key
    type: enum
    description: Final-V5 ProvSQL 冻结分区键
    allowed_values: ["1"]

products:
  - name: expense_summary
    source: travel_demo
    reporting_view: reporting.expense_summary
    description: 按月份、部门和费用类型汇总的差旅报销数据
    sensitivity: low
    # Stable published-row identity for task-bound exposure accounting.
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-summary-v1
    entity_key: [month, department, expense_type]
    # Canonical semantic identity is independent from the reporting view alias.
    fact_namespace: travel.expense_summary
    stable_relation_role: expense_summary
    scopes: [department]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: month
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 月份，格式 YYYY-MM
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: total_amount
        type: numeric
        description: 总金额
      - name: request_count
        type: bigint
        description: 申请数

  - name: expense_detail
    source: travel_demo
    reporting_view: reporting.expense_detail
    description: 员工级差旅报销明细
    sensitivity: high
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-detail-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: [date_trunc, to_char]
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [sum, count, min, max]
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: employee_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 员工编号
        sensitivity: high
      - name: employee_name
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 员工姓名
        sensitivity: high
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_date
        type: date
        description: 报销日期
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: amount
        type: numeric
        description: 报销金额
      - name: city
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 出差城市
      - name: purpose
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销用途
      - name: status
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 审批状态

  # Dedicated immutable relation for the frozen Final-V5 A--D corpus. Its
  # medium classification selects the evaluation profile without changing the
  # authorization semantics of the production high-sensitivity product used
  # by the E ceiling trace.
  - name: final_v5_attack_expense_detail
    source: travel_demo
    reporting_view: reporting.final_v5_attack_expense_detail
    description: IEEE TKDE Final-V5 Attack A-D 专用冻结报销字段
    sensitivity: medium
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-detail-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: []
    allowed_operators: ["=", "<>", "<", "<=", ">", ">=", "+", "-", "*", "/"]
    allowed_aggregates: [count]
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: amount
        type: numeric
        description: 报销金额

  # Dedicated physically materialized product for the frozen same-root
  # concurrency matrix. One approved task owns the one production V5 root;
  # width denotes unique requests on that same task, never child tasks.
  - name: final_v5_concurrency_expense_detail
    source: travel_demo
    reporting_view: reporting.final_v5_concurrency_expense_detail
    description: IEEE TKDE Final-V5 单任务同根并发专用冻结报销字段
    sensitivity: medium
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-detail-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: []
    allowed_operators: ["="]
    allowed_aggregates: []
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: expense_type
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 费用类型
      - name: city
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 出差城市

  # Independent immutable publications for the paired RLS validity-control
  # and 70%-budget arms. Both preserve the expense-detail semantic identity;
  # distinct products select immutable, predeclared budget profiles.
  - name: final_v5_rls_unlimited_expense_detail
    source: travel_demo
    reporting_view: reporting.final_v5_rls_unlimited_expense_detail
    description: IEEE TKDE Final-V5 RLS 无限暴露有效性对照
    sensitivity: medium
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-detail-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: []
    allowed_operators: ["=", "<=", ">="]
    allowed_aggregates: [count]
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: amount
        type: numeric
        description: 报销金额

  - name: final_v5_rls_bounded_expense_detail
    source: travel_demo
    reporting_view: reporting.final_v5_rls_bounded_expense_detail
    description: IEEE TKDE Final-V5 RLS 预注册 70% 暴露预算对照
    sensitivity: medium
    snapshot: travel-demo-2026-v1
    snapshot_publication: expense-detail-v1
    entity_key: [receipt_no]
    fact_namespace: travel.expense_receipt
    stable_relation_role: expense_detail
    scopes: [department]
    allowed_functions: []
    allowed_operators: ["=", "<=", ">="]
    allowed_aggregates: [count]
    fields:
      - name: receipt_no
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 报销单号
      - name: department
        type: text
        collation: en_US.utf8
        collation_version: "2.36"
        description: 部门
      - name: amount
        type: numeric
        description: 报销金额

  - name: provsql_orders
    source: travel_demo
    reporting_view: reporting.provsql_orders
    description: IEEE TKDE Final-V5 ProvSQL 冻结订单关系
    sensitivity: low
    snapshot: final-v5-provsql-2026-v1
    snapshot_publication: provsql-orders-v1
    entity_key: [orderkey]
    fact_namespace: final_v5.provsql_orders
    stable_relation_role: provsql_orders
    scopes: [partition_key]
    allowed_functions: []
    allowed_operators: ["=", "<="]
    allowed_aggregates: [sum, count]
    fields:
      - name: orderkey
        type: bigint
        description: 冻结订单键
      - name: status
        type: bigint
        description: 冻结订单状态
      - name: partition_key
        type: integer
        description: 强制分区键

  - name: provsql_lineitem
    source: travel_demo
    reporting_view: reporting.provsql_lineitem
    description: IEEE TKDE Final-V5 ProvSQL 冻结订单明细关系
    sensitivity: low
    snapshot: final-v5-provsql-2026-v1
    snapshot_publication: provsql-lineitem-v1
    entity_key: [orderkey, linenumber]
    fact_namespace: final_v5.provsql_lineitem
    stable_relation_role: provsql_lineitem
    scopes: [partition_key]
    allowed_functions: []
    allowed_operators: ["=", "<="]
    allowed_aggregates: [sum, count]
